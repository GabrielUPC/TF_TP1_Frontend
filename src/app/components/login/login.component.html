<div class="login-page">

  <div class="background-map"></div>
  <div class="background-chart"></div>
  <div class="background-wave"></div>

  <div class="login-card">

    <div class="brand">
      <div class="brand-icon">IP</div>
      <div>
        <h1>Plataforma</h1>
        <h2>Predictiva IPRESS</h2>
      </div>
    </div>

    <div class="divider"></div>

    <div class="login-title">
      <div class="shield-icon">⌾</div>
      <h3>Inicio de sesión</h3>
      <p>Acceso restringido según rol e IPRESS asignada</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">

      <div class="form-group">
        <label>Correo institucional</label>
        <div class="input-wrapper">
          <span>✉</span>
          <input
            type="email"
            name="correo"
            [(ngModel)]="correo"
            placeholder="usuario@ipress.gob.pe">
        </div>
      </div>

      <div class="form-group">
        <label>Contraseña</label>
        <div class="input-wrapper">
          <span>▣</span>
          <input
            [type]="mostrarContrasena ? 'text' : 'password'"
            name="contrasena"
            [(ngModel)]="contrasena"
            placeholder="Ingresa tu contraseña">

          <button type="button" class="btn-eye" (click)="alternarContrasena()">
            👁
          </button>
        </div>
      </div>

      <div class="forgot">
        <a routerLink="/recuperar-password">¿Olvidaste tu contraseña?</a>
      </div>

      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>

      <button type="submit" class="btn-login">
        🔒 Iniciar sesión
      </button>

    </form>

    <div class="info-box">
      <div class="info-icon">i</div>
      <p>
        Para solicitar acceso, comuníquese con el administrador de la plataforma.
      </p>
    </div>

  </div>

</div>
